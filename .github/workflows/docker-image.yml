name: QualAI CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/YueYaoYan/#23-github-action-workflow ]
  pull_request:
    branches: [ main, develop ]

env:
  DOCKER_COMPOSE_VERSION: v2.23.0
  PYTHON_VERSION: 3.8

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
        - 6333:6333
        - 6334:6334
        volumes:
        - qdrant_data:/qdrant/storage

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup environment variables
      run: |
        cat << EOF > .env
        # Backend configuration
        DATABASE_URL=${{ secrets.DATABASE_URL }}
        QDRANT_URL=qdrant:6333

        EOF

    # Set up Docker and Compose
    - name: Setup Docker
      run: sudo systemctl start docker

    - name: Install Docker Compose
      run: |
        DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
        mkdir -p $DOCKER_CONFIG/cli-plugins
        curl -SL https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
        chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
        docker compose version

    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: ./client/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('client/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install frontend dependencies
      working-directory: ./client
      run: npm ci

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ./server/__pycache__
        key: ${{ runner.os }}-pip-${{ hashFiles('server/requirements.txt') }}

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      working-directory: ./server
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Start application-specific services using Docker Compose
      run: docker-compose up -d
      continue-on-error: false

    # Frontend build and test (Vite/React)
    - name: Build frontend
      working-directory: ./client
      run: npm run build

    # Backend build and test (FastAPI)
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Run backend tests
      working-directory: ./server/tests
      run: |
        pytest --cov=./ --cov-report=xml
