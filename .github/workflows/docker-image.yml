name: QualAI CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/YueYaoYan/#23-github-action-workflow ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
        - 6333:6333
        - 6334:6334
        volumes:
        - qdrant_data:/qdrant/storage

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup environment variables
      run: |
        cat << EOF > .env
        # Backend configuration
        DATABASE_URL=${{ secrets.DATABASE_URL }}
        QDRANT_URL=qdrant:6333

        EOF

    - name: Setup Docker
      run: sudo systemctl start docker

    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: ./client/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('client/package-lock.json') }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('server/requirements.txt') }}

    - name: Start application-specific services using Docker Compose
      run: docker-compose up -d
      continue-on-error: false

    - name: Build frontend
      working-directory: ./client
      run: npm run build

    - name: Run backend tests
      working-directory: ./server/tests
      run: |
        pytest --cov=./ --cov-report=xml
