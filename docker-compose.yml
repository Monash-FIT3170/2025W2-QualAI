# version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: dockerfile.dev
    container_name: qualai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # This line is for development hot-reloading.
      # It mounts your local ./server directory into the container's /app directory.
      - ./server:/app
      - ./papers:/app/papers
    depends_on:
      - qdrant

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: qualai-client
    ports:
      - "5173:5173"
    environment:
      # This tells your Vite frontend where to find the backend API.
      # It uses the service name 'backend', which works within Docker's network.
      - VITE_API_URL=http://backend:8000
    volumes:
      # Mounts your local client code into the container for hot-reloading.
      - ./client:/app
      # This is a trick to prevent your local node_modules from overwriting
      # the node_modules directory that was installed inside the container.
      - /app/node_modules
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: