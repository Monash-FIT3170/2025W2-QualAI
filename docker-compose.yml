version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: qualai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./server/app:/app/app  # Optional: dev hot reload

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: qualai-client
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000  # Match with backend port
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  qdrant_data:
  