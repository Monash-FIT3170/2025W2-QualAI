# version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: dockerfile
    container_name: qualai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
      - ollama
    environment:
      # Hugging Face / Transformers
      HF_HOME: /tmp/huggingface
      TRANSFORMERS_CACHE: /tmp/huggingface
      TORCH_HOME: /tmp/torch

      # Matplotlib
      MPLCONFIGDIR: /tmp/matplotlib

      # NeMo + Lhotse
      NEMO_HOME: /tmp/nemo
      LHOTSE_CACHE_DIR: /tmp/lhotse
      LHOTSE_TOOLS_CACHE: /tmp/lhotse/tools 
    volumes:
      - ./server/app:/app/app  # Optional: dev hot reload
      - ./server/cache:/home/app
  ollama:
    build:
      context: .
      dockerfile: dockerfile.ollama
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  client:
    build:
      context: ./client
      dockerfile: dockerfile
    container_name: qualai-client
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000  # Match with backend port
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  qdrant_data:
  ollama_data: