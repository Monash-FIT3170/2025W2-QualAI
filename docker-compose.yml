services:
  backend:
    build:
      context: ./server
      dockerfile: dockerfile.dev
    container_name: qualai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./server:/app
      - ./papers:/papers
    # UPDATED: Simplified depends_on
    depends_on:
      - qdrant
      - ollama

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: qualai-client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # REMOVED the healthcheck block from here

  ollama:
    build: ./ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh  # Mount the script
      - ollama_setup:/setup                   # Mount a volume for the setup marker
    entrypoint: ["/entrypoint.sh"]             # Set the entrypoint to our script

volumes:
  qdrant_data:
  ollama_data:
  ollama_setup: # Add the new volume for the setup marke